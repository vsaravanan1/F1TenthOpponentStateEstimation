# Dynamic MPPI params. Mirrors the original MPPI params and adds the divert/return
# settings. Node names must match the rclpy node names in each script.

dynamic_mppi:
  ros__parameters:
    visualize: True
    waypoint_path: "Spielberg_mppi_waypoints_sparse.csv"   # same centerline as the original
    vehicle_frame: "ego_racecar/base_link"

    # Publishers
    drive_topic: "/drive"
    occupancy_topic: "/occupancy_dynamic"
    marker_topic: "/dynamic_trajectory"
    state_topic: "/mppi_state"

    # Subscribers
    pose_topic: "/ego_racecar/odom"
    scan_topic: "/scan"

    # Model (identical to the working MPPI)
    wheelbase: 0.33
    min_throttle: 0.75
    max_throttle: 1.0
    max_steer: 0.3
    dt: 0.1

    # MPPI
    num_trajectories: 100
    steps_trajectories: 25
    v_sigma: 0.05
    omega_sigma: 0.2
    lambda: 10

    # Cost map
    cost_map_width: 100
    cost_map_res: 0.05
    occupancy_dilation: 10

    # ---- dynamic-MPPI additions ----
    divert_topic: "/divert_waypoints"   # csv-like waypoints (converter OR injector)
    state_topic: "/mppi_state"
    divert_speed: 0.85                   # throttle for a divert that carries no v column
    return_len: 4.0                      # nominal rejoin length (m); auto-lengthens if tight
    return_spacing: 0.1                  # resample spacing for divert/return (m)
    allow_interrupt: False               # accept a new divert mid-maneuver (game-theory later)
    revert_margin_pts: 2

divert_path_converter:
  ros__parameters:
    in_topic: "/ego_lane_possibilities"  # selected defensive spline (MarkerArray)
    out_topic: "/divert_waypoints"
    divert_speed: 0.85
    spacing: 0.1
    min_points: 3

divert_injector:
  ros__parameters:
    csv_path: ""                         # set to a file in config/diverts/
    frame: "car"                         # "car" (anchored at ego) or "map"
    out_topic: "/divert_waypoints"
    pose_topic: "/ego_racecar/odom"
    trigger_topic: "/inject_divert"
    divert_speed: 0.85
    auto_fire: True
    startup_delay: 5.0